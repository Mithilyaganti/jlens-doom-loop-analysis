name: cpu-tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: python -m pip install "numpy==1.26.4" "pytest==8.3.5"
      - name: Stats tests and notebook lint
        run: python -m pytest tests/test_stats.py tests/test_notebook_lint.py -q
      - name: Lint Colab notebooks
        run: python scripts/lint_notebooks.py
